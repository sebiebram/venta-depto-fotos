<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המכירה של סבי ואופיר</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      direction: rtl;
      min-height: 100vh;
    }

    .page { max-width: 960px; margin: 0 auto; padding: 0 1rem 3rem; }

    header { text-align: center; padding: 1.5rem 0 1rem; position: relative; }
    header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    header p  { font-size: 13px; color: #888; }
#stats { font-size: 12px; color: #999; margin-bottom: 10px; }

    #filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }

    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      border: 0.5px solid #d8d8d8;
      background: transparent;
      color: #777;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .pill:hover  { border-color: #aaa; }
    .pill.active { border-color: #999; background: #e8e8e5; color: #111; font-weight: 500; }

    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      align-items: stretch;
    }
    @media (min-width: 680px) {
      #grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 0.5px solid #e2e2e0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #ccc; }
    .card.sold  { opacity: 0.62; }

    .card-photo { position: relative; flex-shrink: 0; }
    .card-photo-inner {
      height: 200px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-photo-inner img { width: 100%; height: 100%; object-fit: cover; }
    .card-photo.clickable .card-photo-inner { cursor: pointer; }

    .cat-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 6px;
    }
    .expand-hint {
      position: absolute; bottom: 7px; left: 8px;
      background: rgba(0,0,0,0.28); color: #fff;
      font-size: 11px; border-radius: 4px; padding: 3px 7px;
      display: flex; align-items: center; gap: 3px;
    }
    .sold-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.58);
      display: flex; align-items: center; justify-content: center;
    }
    .sold-label {
      background: #E24B4A; color: #fff;
      font-size: 22px; font-weight: 500;
      padding: 8px 22px; border-radius: 6px;
    }

    .card-body { padding: 8px 12px 10px; display: flex; flex-direction: column; flex: 1; }

    .name-block { min-height: 52px; margin-bottom: 3px; }
    .product-name {
      font-weight: 500; font-size: 14px; line-height: 1.4; margin-bottom: 1px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-desc { font-size: 11px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; }

    .price-row  { height: 28px; margin-bottom: 3px; }
    .price      { font-size: 18px; font-weight: 500; }
    .price.missing { color: #bbb; }

    .date-row   { font-size: 12px; color: #999; }
    .date-row i { font-size: 13px; vertical-align: -1px; }

    .lift-warn { font-size: 10px; color: #BA7517; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
    .lift-warn i { font-size: 11px; }

    .link-row  { height: 22px; margin-top: 2px; display: flex; align-items: center; justify-content: space-between; }
    .orig-link { font-size: 12px; color: #1a6abf; text-decoration: none; display: flex; align-items: center; gap: 3px; line-height: 22px; }
    .orig-link:hover { text-decoration: underline; }
    .orig-link i { font-size: 11px; }

    .spacer { flex: 1; min-height: 8px; }

    .wa-btn {
      width: 100%; background: #25D366; color: #fff;
      border: none; border-radius: 8px; padding: 8px;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: inherit; transition: background 0.15s;
    }
    .wa-btn:hover { background: #1DAA56; }
    .wa-btn i { font-size: 16px; }
    .sold-spacer { height: 34px; }

    /* ── Lightbox ── */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox-img { max-width: 96%; max-height: 90vh; object-fit: contain; cursor: default; }
    #lightbox-close {
      position: absolute; top: 16px; right: 16px;
      width: 48px; height: 48px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #222;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    #lightbox-close:hover { background: #f0f0f0; }


    /* ── Misc ── */
    .msg { grid-column: 1/-1; text-align: center; padding: 3rem; font-size: 14px; }
    .msg.loading { color: #aaa; }
    .msg.error   { color: #E24B4A; }
  </style>
</head>
<body>

<div class="page">
  <header>
    <h1>המכירה של סבי ואופיר</h1>
    <p>גבעתיים</p>
  </header>
  <p id="stats"></p>
  <nav id="filters"></nav>
  <div id="grid"><div class="msg loading">טוען מוצרים...</div></div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox();event.stopPropagation()" aria-label="סגור">
    <i class="ti ti-x"></i>
  </button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>

// ══════════════════════════════════════════════════════════════════
//  הגדרות — CONFIGURATION
//  (עדכן כאן את הפרטים לפני שמשתפים את הדף)
// ══════════════════════════════════════════════════════════════════
const CONFIG = {
  JSON_URL: 'https://raw.githubusercontent.com/sebiebram/venta-depto-fotos/main/products.json',
  WA_SEBI: '972534320437',        // ← מספר וואטסאפ של סבי (ללא +)
  WA_OFIR: '972523087474',        // ← מספר וואטסאפ של אופיר (ללא +)
  DRIVE:   'https://drive.google.com/uc?export=view&id=',
};
// ══════════════════════════════════════════════════════════════════

const CATS = {
  'רהיטים':      { bg: '#E1F5EE', tc: '#085041' },
  'מוצרי חשמל': { bg: '#E6F1FB', tc: '#042C53' },
  'ילדים':       { bg: '#EEEDFE', tc: '#26215C' },
  'מטבח':        { bg: '#FAEEDA', tc: '#412402' },
  'סלון':        { bg: '#E1F5EE', tc: '#085041' },
  'חדר עבודה':  { bg: '#E6F1FB', tc: '#042C53' },
  'שירותים':    { bg: '#E6F1FB', tc: '#042C53' },
  'חדר הורים':  { bg: '#EEEDFE', tc: '#26215C' },
  'חדר ילדים':  { bg: '#EEEDFE', tc: '#26215C' },
  '_':           { bg: '#F1EFE8', tc: '#444441' },
};

function cs(cat) { return CATS[cat?.trim()] || CATS['_']; }

function shortName(c) {
  return c === 'אופיר' ? 'אופיר' : 'סבי';
}

function waUrl(contact, name, id) {
  const num = contact?.trim() === 'אופיר' ? CONFIG.WA_OFIR : CONFIG.WA_SEBI;
  const n   = shortName(contact);
  const msg = encodeURIComponent(`היי ${n}, אני מעוניין/ת ב${name}${id?' (#'+id+')':''}`);
  return `https://wa.me/${num}?text=${msg}`;
}

function parsePrice(v) {
  if (typeof v === 'number') return isNaN(v) ? null : v;
  const n = parseFloat(String(v || '').replace(/[₪,\s]/g, ''));
  return isNaN(n) ? null : n;
}

function bool(v) {
  if (typeof v === 'boolean') return v;
  return String(v || '').trim().toUpperCase() === 'TRUE';
}

function photoSrc(v) {
  if (!v?.trim()) return null;
  return v.trim().startsWith('http') ? v.trim() : CONFIG.DRIVE + v.trim();
}

let products = [];
let active   = 'הכל';

// ── Render card ──────────────────────────────────────────────────
function renderCard(p) {
  const s      = cs(p.cat);
  const price  = parsePrice(p.price);
  const noLift = bool(p.no_lift);
  const sold   = bool(p.sold);
  const wa     = waUrl(p.contact, p.name, p.id);
  const waTxt  = `שלח הודעה ל${shortName(p.contact)}`;
  const foto   = photoSrc(p.foto);

  return `
  <div class="card${sold ? ' sold' : ''}">
    <div class="card-photo${!sold && foto ? ' clickable' : ''}">
      <div class="card-photo-inner"
        style="background:${s.bg};"
        ${!sold && foto ? `onclick="openLightbox('${foto}')"` : ''}>
        ${foto ? `<img src="${foto}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">` : ''}
      </div>
      <span class="cat-badge" style="background:${s.bg};color:${s.tc};">${p.cat}</span>
      ${sold
        ? `<div class="sold-overlay"><span class="sold-label">נמכר</span></div>`
        : foto ? `<span class="expand-hint"><i class="ti ti-zoom-in"></i> הגדל</span>` : ''
      }
    </div>
    <div class="card-body">
      <div class="name-block">
        <p class="product-name">${p.name}</p>
        <p class="product-desc">${p.desc || ''}</p>
      </div>
      <div class="price-row">
        <span class="price${price ? '' : ' missing'}">${price ? '₪' + price.toLocaleString() : '—'}</span>
      </div>
      <p class="date-row"><i class="ti ti-calendar"></i> ${p.date || '—'}</p>
      <div class="link-row">
        ${p.link && !sold
          ? `<a class="orig-link" href="${p.link}" target="_blank" rel="noopener">מוצר מקורי <i class="ti ti-external-link"></i></a>`
          : '<span></span>'}
        ${noLift ? `<span class="lift-warn"><i class="ti ti-alert-triangle"></i> לא מתאים למעלית</span>` : ''}
      </div>
      <div class="spacer"></div>
      ${!sold
        ? `<button class="wa-btn" onclick="window.open('${wa}','_blank')"><i class="ti ti-brand-whatsapp"></i>${waTxt}</button>`
        : `<div class="sold-spacer"></div>`
      }
    </div>
  </div>`;
}

// ── Lightbox ─────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Filters + render ─────────────────────────────────────────────
function render() {
  const visible_all = products.filter(p => !p.hidden);
  const cats = ['הכל', ...new Set(visible_all.map(p => p.cat).filter(Boolean))];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<button class="pill${c === active ? ' active' : ''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');

  const visible = active === 'הכל' ? visible_all : visible_all.filter(p => p.cat === active);
  const avail   = visible.filter(p => !bool(p.sold));
  const sold    = visible.filter(p =>  bool(p.sold));

  document.getElementById('grid').innerHTML =
    [...avail, ...sold].map(renderCard).join('') || '<div class="msg">—</div>';

  document.getElementById('stats').textContent =
    `${avail.length} פריטים זמינים` + (sold.length ? ` · ${sold.length} נמכרו` : '');
}

function setFilter(c) { active = c; render(); }

// ── Load data from JSON ──────────────────────────────────────────
async function load() {
  try {
    const res = await fetch(`${CONFIG.JSON_URL}?t=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    products = Array.isArray(data) ? data.filter(p => p.name) : [];
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div class="msg error">שגיאה בטעינת הנתונים</div>';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});
load();

</script>
</body>
</html>
